{% extends "base_public.html" %}
{% load i18n %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full ui-surface p-8">
        <div class="text-center mb-8">
            <div class="ui-kicker">ForecastMP</div>
            <h2 class="text-2xl font-bold text-gray-900 mt-2">Create an account</h2>
            <p class="mt-2 text-sm text-gray-600">
                Already have an account? <a href="{% url 'accounts:login' %}" class="text-orange-600 hover:text-orange-700">Sign in</a>
            </p>
        </div>

        {% if messages %}
            <div class="space-y-2">
                {% for message in messages %}
                    <div class="text-sm text-red-600">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase">Company name</label>
                <input type="text" name="company_name" required class="mt-2 w-full rounded-xl border-gray-300" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase">Email</label>
                <input type="email" name="email" required class="mt-2 w-full rounded-xl border-gray-300" />
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">First name</label>
                    <input type="text" name="first_name" class="mt-2 w-full rounded-xl border-gray-300" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">Last name</label>
                    <input type="text" name="last_name" class="mt-2 w-full rounded-xl border-gray-300" />
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase">Password</label>
                <input type="password" name="password1" required class="mt-2 w-full rounded-xl border-gray-300" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase">Confirm password</label>
                <input type="password" name="password2" required class="mt-2 w-full rounded-xl border-gray-300" />
            </div>
            <button type="submit" class="w-full ui-btn-primary">
                Create account
            </button>
        </form>
    </div>
</div>
{% endblock %}
