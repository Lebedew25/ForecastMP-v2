{% extends "base_public.html" %}
{% load i18n %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-soft">
        <div>
            <h2 class="text-2xl font-bold text-gray-900 text-center">Create an account</h2>
            <p class="mt-2 text-sm text-gray-600 text-center">
                Already have an account? <a href="{% url 'accounts:login' %}" class="text-primary hover:text-primary-dark">Sign in</a>
            </p>
        </div>

        {% if messages %}
            <div class="space-y-2">
                {% for message in messages %}
                    <div class="text-sm text-red-600">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700">Company name</label>
                <input type="text" name="company_name" required class="mt-1 w-full rounded border-gray-300 focus:border-primary focus:ring-primary" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" required class="mt-1 w-full rounded border-gray-300 focus:border-primary focus:ring-primary" />
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">First name</label>
                    <input type="text" name="first_name" class="mt-1 w-full rounded border-gray-300 focus:border-primary focus:ring-primary" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Last name</label>
                    <input type="text" name="last_name" class="mt-1 w-full rounded border-gray-300 focus:border-primary focus:ring-primary" />
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password1" required class="mt-1 w-full rounded border-gray-300 focus:border-primary focus:ring-primary" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Confirm password</label>
                <input type="password" name="password2" required class="mt-1 w-full rounded border-gray-300 focus:border-primary focus:ring-primary" />
            </div>
            <button type="submit" class="w-full bg-primary text-white py-2 px-4 rounded hover:bg-primary-dark transition-colors">
                Create account
            </button>
        </form>
    </div>
</div>
{% endblock %}
